<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attend</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; }
  video { transform: scaleX(-1); }
  .face-box { position: absolute; border: 2px solid #22c55e; pointer-events: none; }
  .face-label { position: absolute; background: #22c55e; color: white; font-size: 11px; padding: 2px 6px; }
  #videoWrap { position: relative; display: inline-block; }
</style>
</head>
<body class="bg-gray-100">

<div class="flex h-screen">

  <!-- SIDEBAR -->
  <aside class="w-56 bg-[#003366] text-white flex flex-col p-5">
    <h1 class="text-lg font-bold tracking-widest mb-8">SMART ATTEND</h1>
    <button onclick="showView('dashboard')" id="btn-dashboard"
      class="nav-btn text-left px-3 py-2 rounded mb-2 bg-white/20 text-white text-sm">
      <i class="fas fa-home mr-2"></i>Dashboard
    </button>
    <button onclick="showView('database')" id="btn-database"
      class="nav-btn text-left px-3 py-2 rounded mb-2 text-white/70 hover:bg-white/10 text-sm">
      <i class="fas fa-users mr-2"></i>Student DB
    </button>
    <button onclick="showView('reports')" id="btn-reports"
      class="nav-btn text-left px-3 py-2 rounded mb-2 text-white/70 hover:bg-white/10 text-sm">
      <i class="fas fa-chart-bar mr-2"></i>Reports
    </button>
    <div class="mt-auto text-xs text-white/40">
      <div>Storage: LocalStorage</div>
      <div id="syncStatus" class="text-green-300 mt-1">Ready</div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="flex-1 overflow-auto p-6">

    <!-- DASHBOARD VIEW -->
    <div id="view-dashboard">

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 text-center shadow-sm">
          <div class="text-xs text-gray-500 mb-1">Present Today</div>
          <div id="stat-present" class="text-3xl font-semibold text-green-600">0</div>
        </div>
        <div class="bg-white rounded-xl p-4 text-center shadow-sm">
          <div class="text-xs text-gray-500 mb-1">Absent Today</div>
          <div id="stat-absent" class="text-3xl font-semibold text-red-500">0</div>
        </div>
        <div class="bg-white rounded-xl p-4 text-center shadow-sm">
          <div class="text-xs text-gray-500 mb-1">Total Students</div>
          <div id="stat-total" class="text-3xl font-semibold text-blue-600">0</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-6">

        <!-- Camera Card -->
        <div class="bg-white rounded-xl p-5 shadow-sm">
          <h2 class="font-semibold text-gray-700 mb-3">Live Camera</h2>

          <div id="statusBar" class="flex items-center gap-2 text-sm bg-gray-50 rounded-lg px-3 py-2 mb-3">
            <span id="statusDot" class="inline-block w-2 h-2 rounded-full bg-gray-400"></span>
            <span id="statusText">Camera off</span>
          </div>

          <div id="videoWrap" class="rounded-lg overflow-hidden bg-black w-full h-48 flex items-center justify-center mb-3">
            <video id="video" class="w-full h-full object-cover hidden" autoplay muted></video>
            <span id="camPlaceholder" class="text-gray-500 text-sm">Click Start Camera</span>
          </div>

          <input id="studentName" placeholder="Student name (or detected automatically)"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-300" />

          <div class="flex gap-2">
            <button onclick="startCamera()"
              class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-2 rounded-lg transition">
              <i class="fas fa-camera mr-1"></i>Start Camera
            </button>
            <button onclick="markAttendance('IN')"
              class="flex-1 bg-green-500 hover:bg-green-600 text-white text-sm px-3 py-2 rounded-lg transition">
              <i class="fas fa-sign-in-alt mr-1"></i>Entry
            </button>
            <button onclick="markAttendance('OUT')"
              class="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm px-3 py-2 rounded-lg transition">
              <i class="fas fa-sign-out-alt mr-1"></i>Exit
            </button>
          </div>
          <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- Today's Log -->
        <div class="bg-white rounded-xl p-5 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold text-gray-700">Today's Log</h2>
            <button onclick="exportCSV()"
              class="text-xs text-blue-600 border border-blue-200 rounded px-2 py-1 hover:bg-blue-50">
              Export CSV
            </button>
          </div>
          <div class="overflow-auto max-h-72">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-xs text-gray-500 border-b">
                  <th class="text-left py-2">Name</th>
                  <th class="text-left py-2">Time</th>
                  <th class="text-left py-2">Type</th>
                </tr>
              </thead>
              <tbody id="attendanceTable">
                <tr><td colspan="3" class="text-gray-400 text-center py-6">No records yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

    <!-- DATABASE VIEW -->
    <div id="view-database" class="hidden">
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-semibold text-gray-700">Student Database</h2>
          <button onclick="showAddStudent()"
            class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700">
            + Add Student
          </button>
        </div>

        <!-- Add Student Form -->
        <div id="addStudentForm" class="hidden bg-gray-50 rounded-lg p-4 mb-4">
          <div class="grid grid-cols-2 gap-3">
            <input id="newName" placeholder="Full Name" class="border border-gray-200 rounded px-3 py-2 text-sm" />
            <input id="newId" placeholder="Student ID / Roll No." class="border border-gray-200 rounded px-3 py-2 text-sm" />
            <input id="newDept" placeholder="Department" class="border border-gray-200 rounded px-3 py-2 text-sm" />
            <input id="newEmail" placeholder="Email (optional)" class="border border-gray-200 rounded px-3 py-2 text-sm" />
          </div>
          <div class="flex gap-2 mt-3">
            <button onclick="addStudent()" class="bg-green-500 text-white text-sm px-4 py-2 rounded-lg">Save</button>
            <button onclick="document.getElementById('addStudentForm').classList.add('hidden')"
              class="bg-gray-200 text-gray-700 text-sm px-4 py-2 rounded-lg">Cancel</button>
          </div>
        </div>

        <table class="w-full text-sm">
          <thead>
            <tr class="text-xs text-gray-500 border-b">
              <th class="text-left py-2">Name</th>
              <th class="text-left py-2">ID</th>
              <th class="text-left py-2">Department</th>
              <th class="text-left py-2">Total Present</th>
              <th class="text-left py-2">Action</th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </div>

    <!-- REPORTS VIEW -->
    <div id="view-reports" class="hidden">
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-semibold text-gray-700">Attendance Report</h2>
          <button onclick="exportCSV()"
            class="bg-green-500 text-white text-sm px-4 py-2 rounded-lg hover:bg-green-600">
            Download CSV
          </button>
        </div>
        <div id="reportTable"></div>
      </div>
    </div>

  </main>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
function getData(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch { return []; }
}
function setData(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

let currentView = 'dashboard';

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function showView(name) {
  ['dashboard','database','reports'].forEach(v => {
    document.getElementById('view-' + v).classList.add('hidden');
    document.getElementById('btn-' + v)?.classList.remove('bg-white/20');
    document.getElementById('btn-' + v)?.classList.add('text-white/70');
  });
  document.getElementById('view-' + name).classList.remove('hidden');
  const btn = document.getElementById('btn-' + name);
  btn?.classList.add('bg-white/20');
  btn?.classList.remove('text-white/70');
  currentView = name;
  if (name === 'database') renderStudentTable();
  if (name === 'reports') renderReports();
  if (name === 'dashboard') renderAttendanceTable();
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.classList.remove('hidden');
    document.getElementById('camPlaceholder').classList.add('hidden');
    setStatus('Camera active', 'green');
  } catch (e) {
    setStatus('Camera permission denied', 'red');
    alert('Please allow camera access in your browser.');
  }
}

function setStatus(msg, color) {
  document.getElementById('statusText').textContent = msg;
  const dot = document.getElementById('statusDot');
  dot.className = 'inline-block w-2 h-2 rounded-full';
  if (color === 'green') dot.classList.add('bg-green-500');
  else if (color === 'red') dot.classList.add('bg-red-500');
  else dot.classList.add('bg-gray-400');
}

function captureFrame() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth || 300;
  canvas.height = video.videoHeight || 200;
  canvas.getContext('2d').drawImage(video, 0, 0);
  return canvas.toDataURL('image/jpeg', 0.6);
}

// ── ATTENDANCE ────────────────────────────────────────────────────────────────
function markAttendance(type) {
  const nameInput = document.getElementById('studentName');
  const name = nameInput.value.trim();

  if (!name) {
    alert('Please enter a student name before marking attendance.');
    nameInput.focus();
    return;
  }

  const records = getData('attendance');
  const now = new Date();
  const today = now.toLocaleDateString('en-IN');
  const time = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

  // Prevent duplicate entry for same person same day
  const alreadyMarked = records.find(r =>
    r.name.toLowerCase() === name.toLowerCase() &&
    r.date === today &&
    r.type === type
  );
  if (alreadyMarked) {
    alert(`${name} has already been marked ${type} today.`);
    return;
  }

  const image = captureFrame();
  records.push({ name, date: today, time, type, image });
  setData('attendance', records);

  nameInput.value = '';
  setStatus(`${type} marked for ${name}`, 'green');
  renderAttendanceTable();
  updateStats();

  setTimeout(() => setStatus('Camera active', 'green'), 3000);
}

function renderAttendanceTable() {
  const records = getData('attendance');
  const today = new Date().toLocaleDateString('en-IN');
  const todayRecords = records.filter(r => r.date === today).reverse();
  const tbody = document.getElementById('attendanceTable');

  if (!todayRecords.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="text-gray-400 text-center py-6">No records yet</td></tr>';
    return;
  }

  tbody.innerHTML = todayRecords.map(r => `
    <tr class="border-b hover:bg-gray-50">
      <td class="py-2 font-medium">${r.name}</td>
      <td class="py-2 text-gray-500">${r.time}</td>
      <td class="py-2">
        <span class="px-2 py-1 rounded-full text-xs font-medium ${
          r.type === 'IN'
            ? 'bg-green-100 text-green-700'
            : 'bg-red-100 text-red-700'
        }">${r.type}</span>
      </td>
    </tr>
  `).join('');
}

function updateStats() {
  const records = getData('attendance');
  const students = getData('students');
  const today = new Date().toLocaleDateString('en-IN');
  const todayNames = [...new Set(records.filter(r => r.date === today && r.type === 'IN').map(r => r.name.toLowerCase()))];

  document.getElementById('stat-present').textContent = todayNames.length;
  document.getElementById('stat-total').textContent = students.length;
  document.getElementById('stat-absent').textContent = Math.max(0, students.length - todayNames.length);
}

// ── STUDENT DB ────────────────────────────────────────────────────────────────
function showAddStudent() {
  document.getElementById('addStudentForm').classList.toggle('hidden');
}

function addStudent() {
  const name = document.getElementById('newName').value.trim();
  const id = document.getElementById('newId').value.trim();
  const dept = document.getElementById('newDept').value.trim();
  const email = document.getElementById('newEmail').value.trim();

  if (!name || !id) { alert('Name and Student ID are required.'); return; }

  const students = getData('students');
  if (students.find(s => s.id === id)) { alert('Student ID already exists.'); return; }

  students.push({ name, id, dept, email });
  setData('students', students);

  ['newName','newId','newDept','newEmail'].forEach(f => document.getElementById(f).value = '');
  document.getElementById('addStudentForm').classList.add('hidden');
  renderStudentTable();
  updateStats();
}

function deleteStudent(id) {
  if (!confirm('Remove this student?')) return;
  const students = getData('students').filter(s => s.id !== id);
  setData('students', students);
  renderStudentTable();
  updateStats();
}

function renderStudentTable() {
  const students = getData('students');
  const records = getData('attendance');
  const tbody = document.getElementById('studentTable');

  if (!students.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-gray-400 text-center py-6">No students added yet</td></tr>';
    return;
  }

  tbody.innerHTML = students.map(s => {
    const present = [...new Set(
      records.filter(r => r.name.toLowerCase() === s.name.toLowerCase() && r.type === 'IN').map(r => r.date)
    )].length;
    return `
      <tr class="border-b hover:bg-gray-50">
        <td class="py-2 font-medium">${s.name}</td>
        <td class="py-2 text-gray-500">${s.id}</td>
        <td class="py-2 text-gray-500">${s.dept || '—'}</td>
        <td class="py-2"><span class="text-green-600 font-medium">${present}</span> days</td>
        <td class="py-2">
          <button onclick="deleteStudent('${s.id}')"
            class="text-red-500 hover:text-red-700 text-xs">Remove</button>
        </td>
      </tr>
    `;
  }).join('');
}

// ── REPORTS ───────────────────────────────────────────────────────────────────
function renderReports() {
  const records = getData('attendance');
  const div = document.getElementById('reportTable');

  if (!records.length) {
    div.innerHTML = '<p class="text-gray-400 text-center py-6">No attendance records yet.</p>';
    return;
  }

  const grouped = {};
  records.forEach(r => {
    if (!grouped[r.date]) grouped[r.date] = [];
    grouped[r.date].push(r);
  });

  div.innerHTML = Object.keys(grouped).sort().reverse().map(date => `
    <div class="mb-6">
      <h3 class="font-medium text-gray-700 mb-2 border-b pb-1">${date}</h3>
      <table class="w-full text-sm">
        <thead><tr class="text-xs text-gray-500">
          <th class="text-left py-1">Name</th>
          <th class="text-left py-1">Time</th>
          <th class="text-left py-1">Type</th>
        </tr></thead>
        <tbody>
          ${grouped[date].map(r => `
            <tr class="border-b">
              <td class="py-1">${r.name}</td>
              <td class="py-1 text-gray-500">${r.time}</td>
              <td class="py-1">
                <span class="px-2 py-0.5 rounded-full text-xs ${
                  r.type === 'IN' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
                }">${r.type}</span>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

// ── EXPORT CSV ────────────────────────────────────────────────────────────────
function exportCSV() {
  const records = getData('attendance');
  if (!records.length) { alert('No records to export.'); return; }

  const header = 'Name,Date,Time,Type\n';
  const rows = records.map(r => `"${r.name}","${r.date}","${r.time}","${r.type}"`).join('\n');
  const blob = new Blob([header + rows], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'attendance_' + new Date().toLocaleDateString('en-IN').replace(/\//g, '-') + '.csv';
  a.click();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
window.onload = () => {
  renderAttendanceTable();
  updateStats();
};
</script>
</body>
</html>
