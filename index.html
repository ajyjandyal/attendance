<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attend - Live Scanner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-2xl w-full text-center">
        <h1 class="text-3xl font-bold text-blue-900 mb-6">Student Registration Camera</h1>
        
        <div class="video-container relative bg-black rounded-lg overflow-hidden border-4 border-gray-800 mb-6 flex justify-center">
            <video id="videoElement" autoplay playsinline class="w-full max-w-lg"></video>
            
            <div id="scanOverlay" class="hidden absolute inset-0 border-2 border-green-500/50 m-4 rounded">
                <div class="scan-line"></div>
            </div>
        </div>

        <canvas id="canvasElement" class="hidden"></canvas>

        <div class="flex justify-center gap-4">
            <button id="startBtn" class="px-6 py-3 bg-green-600 text-white rounded font-bold hover:bg-green-700 transition-colors">
                1. Start Camera
            </button>
            <button id="captureBtn" class="px-6 py-3 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 transition-colors hidden">
                2. Capture & Save
            </button>
        </div>

        <p id="statusMessage" class="mt-4 text-gray-600 font-medium">System Ready</p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
