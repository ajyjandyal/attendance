<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attend - Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#003366',
                secondary: '#bf0000'
            }
        }
    }
}
</script>
</head>

<body class="bg-gray-100">

<!-- MAIN -->
<div class="flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white p-5">
    <h1 class="text-xl font-bold mb-6">SMART ATTEND</h1>

    <button onclick="showView('dashboard')" class="block mb-3">Dashboard</button>
    <button onclick="showView('database')" class="block">Student DB</button>
</aside>

<!-- CONTENT -->
<div class="flex-1 p-6 overflow-auto">

<!-- DASHBOARD -->
<div id="view-dashboard">

    <!-- NAME INPUT -->
    <input id="studentName" placeholder="Enter Student Name"
    class="px-4 py-2 border rounded w-full mb-4">

    <!-- CAMERA -->
    <video id="video" width="300" autoplay></video>
<br><br>
<button onclick="capture()">Mark Entry</button>

<h2>Attendance Records</h2>
<div id="records"></div>
    <div class="bg-white p-6 rounded shadow mb-6">
        <h2 class="font-bold mb-4">Live Camera</h2>

        <div class="h-64 bg-black flex items-center justify-center rounded">
            <video id="videoElement" class="w-full h-full hidden" autoplay></video>
            <span id="cameraPlaceholder" class="text-gray-400">Camera Off</span>
        </div>

        <div id="statusBox" class="mt-3 text-center">System Ready</div>

        <div class="mt-4 flex gap-3">
            <button onclick="startCamera()" class="bg-blue-600 text-white px-4 py-2 rounded">Start</button>
            <button onclick="markAttendance('ENTRY')" class="bg-green-600 text-white px-4 py-2 rounded">Entry</button>
            <button onclick="markAttendance('EXIT')" class="bg-red-600 text-white px-4 py-2 rounded">Exit</button>
            <button onclick="captureImage()">Mark Entry</button>
        </div>
        

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- TABLE -->
    <div class="bg-white p-6 rounded shadow">
        <h2 class="font-bold mb-4">Attendance Records</h2>

        <table class="w-full">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-2">Name</th>
                    <th class="p-2">Time</th>
                    <th class="p-2">Type</th>
                </tr>
            </thead>
            <tbody id="attendanceTable"></tbody>
        </table>
    </div>

</div>

<!-- DATABASE VIEW -->
<div id="view-database" class="hidden">
    <h2 class="text-xl font-bold">Student Database</h2>
</div>

</div>
</div>
<script>
const video = document.getElementById('video');

// START CAMERA
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  } catch (err) {
    alert("Camera permission denied ❌");
  }
}

// CAPTURE IMAGE
function capture() {
  const canvas = document.createElement('canvas');
  canvas.width = 300;
  canvas.height = 200;
  const ctx = canvas.getContext('2d');

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const image = canvas.toDataURL("image/png");

  saveAttendance(image);
}

// SAVE DATA
function saveAttendance(image) {
  let data = JSON.parse(localStorage.getItem("attendance")) || [];

  data.push({
    time: new Date().toLocaleString(),
    image: image
  });

  localStorage.setItem("attendance", JSON.stringify(data));

  alert("Attendance Marked ✅");

  showRecords();
}

// SHOW RECORDS
function showRecords() {
  let data = JSON.parse(localStorage.getItem("attendance")) || [];
  let recordsDiv = document.getElementById("records");

  recordsDiv.innerHTML = "";

  data.forEach(item => {
    recordsDiv.innerHTML += `
      <div style="margin-bottom:10px;">
        <p>${item.time}</p>
        <img src="${item.image}" width="150"/>
      </div>
    `;
  });
}

// LOAD ON START
window.onload = () => {
  startCamera();
  showRecords();
};
</script>

</body>
</html>
