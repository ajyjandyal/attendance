<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Attend AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
canvas {
    position: absolute;
}
</style>
</head>

<body class="bg-gray-50">

<div class="flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-blue-900 text-white p-4">
    <h1 class="text-xl font-bold mb-4">SMART ATTEND</h1>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6">

<h2 class="text-xl font-bold mb-4">AI Face Recognition</h2>

<div class="relative w-[640px] h-[480px]">
    <video id="video" width="640" height="480" autoplay muted></video>
</div>

<button onclick="startCamera()" class="mt-4 px-4 py-2 bg-blue-600 text-white">
    Start Scanner
</button>

</main>
</div>

<script>
const labeledDescriptors = [];

// LOAD MODELS
Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri('models'),
    faceapi.nets.faceLandmark68Net.loadFromUri('models'),
    faceapi.nets.faceRecognitionNet.loadFromUri('models'),
]).then(loadFaces);

// LOAD KNOWN FACES
async function loadFaces() {
    const labels = ["ajay", "tejas"]; // same as image names

    for (let label of labels) {
        const img = await faceapi.fetchImage(`faces/${label}.jpg`);
        const detections = await faceapi.detectSingleFace(img)
            .withFaceLandmarks()
            .withFaceDescriptor();

        labeledDescriptors.push(
            new faceapi.LabeledFaceDescriptors(label, [detections.descriptor])
        );
    }

    startCamera();
}

// START CAMERA
async function startCamera() {
    const video = document.getElementById("video");

    const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
    video.srcObject = stream;

    video.addEventListener('play', () => {
        const canvas = faceapi.createCanvasFromMedia(video);
        document.querySelector('.relative').append(canvas);

        const displaySize = { width: video.width, height: video.height };
        faceapi.matchDimensions(canvas, displaySize);

        const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors);

        setInterval(async () => {
            const detections = await faceapi.detectAllFaces(
                video,
                new faceapi.TinyFaceDetectorOptions()
            ).withFaceLandmarks().withFaceDescriptors();

            const resized = faceapi.resizeResults(detections, displaySize);

            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

            const results = resized.map(d =>
                faceMatcher.findBestMatch(d.descriptor)
            );

            results.forEach((result, i) => {
                const box = resized[i].detection.box;

                new faceapi.draw.DrawBox(box, {
                    label: result.toString()
                }).draw(canvas);
            });

        }, 100);
    });
}
</script>

</body>
</html>
