<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attend - Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#003366',
                secondary: '#bf0000',
            }
        }
    }
}
</script>
</head>

<body class="bg-gray-50">

<div class="flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white flex flex-col">
    <div class="p-4 font-bold text-lg">SMART ATTEND</div>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6">

<h1 class="text-2xl font-bold mb-6">Live Facial Recognition</h1>

<!-- CAMERA -->
<div class="bg-black h-[400px] rounded-lg flex items-center justify-center overflow-hidden relative">
    <video id="video" autoplay class="w-full h-full object-cover hidden"></video>
    <p id="placeholder" class="text-gray-400">Camera is OFF</p>
</div>

<!-- BUTTONS -->
<div class="mt-4 flex gap-4">
    <button onclick="startCamera()" class="px-6 py-2 bg-primary text-white rounded">
        Start Scanner
    </button>

    <button onclick="stopCamera()" class="px-6 py-2 bg-red-600 text-white rounded">
        Stop
    </button>
</div>

<!-- LOGS -->
<div class="mt-8 bg-white p-4 rounded shadow">
    <h2 class="font-bold mb-4">Recent Logs</h2>
    <div id="logs" class="space-y-2 text-sm"></div>
</div>

</main>
</div>

<script>
let stream;

// START CAMERA
async function startCamera() {
    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");

    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;

    video.classList.remove("hidden");
    placeholder.style.display = "none";

    simulateRecognition();
}

// STOP CAMERA
function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    document.getElementById("video").classList.add("hidden");
    document.getElementById("placeholder").style.display = "block";
}

// FAKE AI DETECTION (for demo)
function simulateRecognition() {
    const names = ["Ajay Jandyal", "Tejas", "Priyanshu", "Unknown"];

    setInterval(() => {
        const name = names[Math.floor(Math.random() * names.length)];
        const time = new Date().toLocaleTimeString();

        const log = document.createElement("div");
        log.className = "p-2 border rounded flex justify-between";

        log.innerHTML = `
            <span>${name}</span>
            <span>${time}</span>
        `;

        document.getElementById("logs").prepend(log);

    }, 3000);
}
</script>

</body>
</html>
