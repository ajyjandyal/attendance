<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attend</title>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
canvas { position: absolute; }
</style>

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#003366',
                secondary: '#bf0000'
            }
        }
    }
}
</script>
</head>

<body class="bg-gray-50">

<!-- LOGIN -->
<div id="loginPage" class="flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded shadow w-80">
        <h2 class="text-xl mb-4">Login</h2>
        <input id="username" placeholder="Username" class="border p-2 w-full mb-2">
        <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">
        <button onclick="login()" class="bg-blue-600 text-white w-full py-2">Login</button>
    </div>
</div>

<!-- APP -->
<div id="app" class="hidden flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white flex flex-col">
    <div class="p-5 font-bold text-lg">SMART ATTEND</div>

    <nav class="px-4 space-y-2">
        <button onclick="showSection('dashboard')" class="w-full text-left px-4 py-2 bg-blue-800 rounded">Dashboard</button>
        <button onclick="showSection('scanner')" class="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Live Scanner</button>
        <button onclick="showSection('students')" class="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Student Database</button>
        <button onclick="showSection('export')" class="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Export Logs</button>
    </nav>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6 overflow-y-auto">

<!-- DASHBOARD -->
<div id="dashboard">
<h1 class="text-2xl font-bold mb-6">Overview</h1>

<div class="grid grid-cols-4 gap-6 mb-6">
<div class="bg-white p-4 rounded shadow"><p>Total Students</p><h2>120</h2></div>
<div class="bg-white p-4 rounded shadow"><p>Present Today</p><h2 id="presentCount">0</h2></div>
<div class="bg-white p-4 rounded shadow"><p>Absent</p><h2>15</h2></div>
<div class="bg-white p-4 rounded shadow"><p>Confidence</p><h2>96.8%</h2></div>
</div>

<div class="bg-white p-4 rounded shadow">
<h2 class="font-bold mb-2">Recent Logs</h2>
<div id="logs"></div>
</div>
</div>

<!-- SCANNER -->
<div id="scanner" class="hidden">
<h2 class="text-xl font-bold mb-4">AI Scanner</h2>

<div class="flex gap-4 mb-3">
    <button onclick="startCamera()" class="bg-green-600 text-white px-4 py-2 rounded">Start</button>
    <button onclick="stopCamera()" class="bg-red-600 text-white px-4 py-2 rounded">Stop</button>
    <button onclick="captureNow()" class="bg-blue-600 text-white px-4 py-2 rounded">Capture</button>
</div>

<div id="status" class="text-sm mb-2">Status: Idle</div>

<div class="relative w-[640px] h-[480px]">
<video id="video" width="640" height="480" autoplay muted></video>
</div>
</div>

<!-- STUDENTS -->
<div id="students" class="hidden">
<h2 class="text-xl font-bold mb-4">Student Database</h2>
<ul><li>Ajay</li><li>Tejas</li></ul>
</div>

<!-- EXPORT -->
<div id="export" class="hidden">
<h2 class="text-xl font-bold mb-4">Export Logs</h2>
<button onclick="exportData()" class="bg-green-600 text-white px-4 py-2">Download CSV</button>
</div>

</main>
</div>

<script>
function login(){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").classList.remove("hidden");
}

function showSection(id){
    ["dashboard","scanner","students","export"].forEach(sec=>{
        document.getElementById(sec).classList.add("hidden");
    });
    document.getElementById(id).classList.remove("hidden");
}

let labeledDescriptors=[];
let attendance=new Set();
let stream=null;
let running=false;

async function loadModels(){
    document.getElementById("status").innerText="Loading models...";

    await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri('/attendance/models'),
        faceapi.nets.faceLandmark68Net.loadFromUri('/attendance/models'),
        faceapi.nets.faceRecognitionNet.loadFromUri('/attendance/models'),
    ]);

    document.getElementById("status").innerText="Models Loaded";
    await loadFaces();
}

async function loadFaces(){
    const labels=["ajay","tejas"];

    for(let label of labels){
        const img=await faceapi.fetchImage(`faces/${label}.jpg`);
        const detection=await faceapi.detectSingleFace(img)
            .withFaceLandmarks()
            .withFaceDescriptor();

        labeledDescriptors.push(
            new faceapi.LabeledFaceDescriptors(label,[detection.descriptor])
        );
    }
}

async function startCamera(){
    await loadModels();

    const video=document.getElementById("video");

    stream=await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject=stream;

    running=true;
    document.getElementById("status").innerText="Camera Running";

    video.onplay=()=>{
        const canvas=faceapi.createCanvasFromMedia(video);
        document.querySelector('.relative').append(canvas);

        const size={width:video.width,height:video.height};
        faceapi.matchDimensions(canvas,size);

        const matcher=new faceapi.FaceMatcher(labeledDescriptors);

        setInterval(async ()=>{
            if(!running) return;

            const detections=await faceapi.detectAllFaces(
                video,new faceapi.TinyFaceDetectorOptions()
            ).withFaceLandmarks().withFaceDescriptors();

            const resized=faceapi.resizeResults(detections,size);
            canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);

            resized.forEach(d=>{
                const result=matcher.findBestMatch(d.descriptor);

                new faceapi.draw.DrawBox(d.detection.box,{
                    label:result.toString()
                }).draw(canvas);

                if(result.label!=="unknown"){
                    markAttendance(result.label);
                }
            });

        },100);
    };
}

function stopCamera(){
    running=false;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    document.getElementById("status").innerText="Stopped";
}

function captureNow(){
    document.getElementById("status").innerText="Captured";
}

function markAttendance(name){
    if(!attendance.has(name)){
        attendance.add(name);

        const log=document.createElement("div");
        log.innerText=`${name} marked at ${new Date().toLocaleTimeString()}`;
        document.getElementById("logs").prepend(log);

        document.getElementById("presentCount").innerText=attendance.size;
    }
}

function exportData(){
    let data="Name,Time\n";
    attendance.forEach(name=>{
        data+=name+","+new Date().toLocaleTimeString()+"\n";
    });

    const blob=new Blob([data],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="attendance.csv";
    a.click();
}
</script>

</body>
</html>
