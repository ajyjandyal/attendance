<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attend</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#003366',
                secondary: '#bf0000',
            }
        }
    }
}
</script>
</head>

<body class="bg-gray-50 text-gray-800">

<div class="flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white flex flex-col">
    <div class="p-5 text-lg font-bold">SMART ATTEND</div>

    <nav class="flex-1 px-4 space-y-2">
        <a class="block px-4 py-2 bg-blue-800 rounded">Dashboard</a>
        <a class="block px-4 py-2 hover:bg-blue-800 rounded">Live Scanner</a>
        <a class="block px-4 py-2 hover:bg-blue-800 rounded">Student Database</a>
        <a class="block px-4 py-2 hover:bg-blue-800 rounded">Export Logs</a>
    </nav>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6 overflow-y-auto">

<h1 class="text-2xl font-bold mb-6">Overview</h1>

<!-- STATS -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">

<div class="bg-white p-4 rounded shadow">
    <p class="text-gray-500">Total Students</p>
    <h2 class="text-2xl font-bold">120</h2>
</div>

<div class="bg-white p-4 rounded shadow">
    <p class="text-gray-500">Present Today</p>
    <h2 class="text-2xl font-bold text-green-600">105</h2>
</div>

<div class="bg-white p-4 rounded shadow">
    <p class="text-gray-500">Absent</p>
    <h2 class="text-2xl font-bold text-red-600">15</h2>
</div>

<div class="bg-white p-4 rounded shadow">
    <p class="text-gray-500">Avg Confidence</p>
    <h2 class="text-2xl font-bold text-blue-600">96.8%</h2>
</div>

</div>

<!-- CAMERA -->
<div class="bg-white p-6 rounded shadow">

<h2 class="font-bold mb-4">Live Camera Feed</h2>

<div class="w-full h-[400px] bg-black rounded relative overflow-hidden">

<video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>

<div id="placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400">
    Camera is OFF
</div>

</div>

<div class="mt-4 flex gap-4">
    <button onclick="startCamera()" class="px-4 py-2 bg-primary text-white rounded">
        Start Scanner
    </button>

    <button onclick="stopCamera()" class="px-4 py-2 bg-red-600 text-white rounded">
        Stop
    </button>
</div>

</div>

</main>
</div>

<script>
let stream;

async function startCamera() {
    try {
        const video = document.getElementById("video");
        const placeholder = document.getElementById("placeholder");

        stream = await navigator.mediaDevices.getUserMedia({ video: true });

        video.srcObject = stream;
        video.classList.remove("hidden");
        placeholder.style.display = "none";

    } catch (err) {
        alert("Allow camera access!");
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    document.getElementById("video").classList.add("hidden");
    document.getElementById("placeholder").style.display = "flex";
}
</script>

</body>
</html>
