<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attend - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#003366',
                        secondary: '#bf0000',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<div class="flex h-screen overflow-hidden">
    
    <!-- SIDEBAR -->
    <aside class="w-64 bg-primary text-white flex flex-col shadow-xl">
        <div class="h-16 flex items-center px-6 bg-blue-900 border-b border-blue-800">
            <span class="text-lg font-bold tracking-wider">SMART ATTEND</span>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
            <h1 class="text-xl font-bold">Overview</h1>
            <span id="currentTime"></span>
        </header>

        <div class="p-8">

            <!-- CAMERA SECTION -->
            <div class="bg-white p-6 rounded-xl shadow">

                <h2 class="text-lg font-bold mb-4">Live Camera Feed</h2>

                <div class="w-full h-[400px] bg-gray-900 rounded-lg relative overflow-hidden border-4 border-gray-800">

                    <!-- VIDEO -->
                    <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>

                    <!-- PLACEHOLDER -->
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-video text-gray-600 text-5xl mb-4"></i>
                        <p class="text-gray-400">Camera is OFF</p>
                    </div>

                    <!-- SCANNER DESIGN -->
                    <div class="absolute inset-0 border-2 border-green-500/30 m-8 rounded"></div>
                    <div class="absolute top-8 left-8 w-8 h-8 border-t-4 border-l-4 border-green-500"></div>
                    <div class="absolute top-8 right-8 w-8 h-8 border-t-4 border-r-4 border-green-500"></div>
                    <div class="absolute bottom-8 left-8 w-8 h-8 border-b-4 border-l-4 border-green-500"></div>
                    <div class="absolute bottom-8 right-8 w-8 h-8 border-b-4 border-r-4 border-green-500"></div>
                </div>

                <!-- BUTTONS -->
                <div class="mt-4 flex gap-4">
                    <button onclick="startCamera()" class="px-4 py-2 bg-primary text-white rounded-md">
                        <i class="fa-solid fa-play mr-2"></i> Start Scanner
                    </button>

                    <button onclick="stopCamera()" class="px-4 py-2 bg-white border rounded-md">
                        <i class="fa-solid fa-stop mr-2"></i> Stop
                    </button>
                </div>

            </div>

        </div>
    </main>
</div>

<script>
function updateTime() {
    const now = new Date();
    document.getElementById('currentTime').innerText = now.toLocaleTimeString();
}
setInterval(updateTime, 1000);

// CAMERA LOGIC
let stream;

async function startCamera() {
    try {
        const video = document.getElementById("video");
        const placeholder = document.getElementById("placeholder");

        stream = await navigator.mediaDevices.getUserMedia({ video: true });

        video.srcObject = stream;
        video.classList.remove("hidden");
        placeholder.style.display = "none";

    } catch (err) {
        alert("Camera access denied!");
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    document.getElementById("video").classList.add("hidden");
    document.getElementById("placeholder").style.display = "flex";
}
</script>

</body>
</html>
