<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attend</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#003366',
            }
        }
    }
}
</script>
</head>

<body class="bg-gray-50">

<div class="flex h-screen">

<!-- SIDEBAR -->
<aside class="w-64 bg-primary text-white flex flex-col">
    <div class="p-5 text-lg font-bold">SMART ATTEND</div>

    <nav class="flex-1 px-4 space-y-2">
        <button onclick="showSection('dashboard')" class="w-full text-left px-4 py-2 bg-blue-800 rounded">Dashboard</button>
        <button onclick="showSection('scanner')" class="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Live Scanner</button>
        <button onclick="showSection('students')" class="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Student Database</button>
        <button onclick="showSection('export')" class="w-full text-left px-4 py-2 hover:bg-blue-800 rounded">Export Logs</button>
    </nav>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6 overflow-y-auto">

<!-- DASHBOARD -->
<div id="dashboard">
    <h1 class="text-2xl font-bold mb-6">Overview</h1>

    <div class="grid grid-cols-4 gap-6 mb-6">
        <div class="bg-white p-4 rounded shadow">
            <p>Total Students</p>
            <h2 class="text-2xl font-bold">120</h2>
        </div>

        <div class="bg-white p-4 rounded shadow">
            <p>Present Today</p>
            <h2 class="text-2xl font-bold text-green-600">105</h2>
        </div>

        <div class="bg-white p-4 rounded shadow">
            <p>Absent</p>
            <h2 class="text-2xl font-bold text-red-600">15</h2>
        </div>

        <div class="bg-white p-4 rounded shadow">
            <p>Avg Confidence</p>
            <h2 class="text-2xl font-bold text-blue-600">96.8%</h2>
        </div>
    </div>
</div>

<!-- SCANNER -->
<div id="scanner" class="hidden">
    <h2 class="text-xl font-bold mb-4">Live Scanner</h2>

    <div class="bg-black h-[400px] rounded relative overflow-hidden">
        <video id="video" autoplay playsinline class="w-full h-full hidden"></video>
        <div id="placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400">
            Camera is OFF
        </div>
    </div>

    <div class="mt-4 flex gap-4">
        <button onclick="startCamera()" class="px-4 py-2 bg-primary text-white rounded">Start</button>
        <button onclick="stopCamera()" class="px-4 py-2 bg-red-600 text-white rounded">Stop</button>
    </div>
</div>

<!-- STUDENTS -->
<div id="students" class="hidden">
    <h2 class="text-xl font-bold mb-4">Student Database</h2>

    <div class="bg-white p-4 rounded shadow">
        <ul class="space-y-2">
            <li>Ajay Jandyal</li>
            <li>Tejas Dharashivkar</li>
            <li>Priyanshu Rai</li>
        </ul>
    </div>
</div>

<!-- EXPORT -->
<div id="export" class="hidden">
    <h2 class="text-xl font-bold mb-4">Export Logs</h2>

    <button onclick="exportData()" class="px-4 py-2 bg-green-600 text-white rounded">
        Download CSV
    </button>
</div>

</main>
</div>

<script>
// NAVIGATION
function showSection(section) {
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("scanner").classList.add("hidden");
    document.getElementById("students").classList.add("hidden");
    document.getElementById("export").classList.add("hidden");

    document.getElementById(section).classList.remove("hidden");
}

// CAMERA
let stream;

async function startCamera() {
    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");

    stream = await navigator.mediaDevices.getUserMedia({ video: true });

    video.srcObject = stream;
    video.classList.remove("hidden");
    placeholder.style.display = "none";
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    document.getElementById("video").classList.add("hidden");
    document.getElementById("placeholder").style.display = "flex";
}

// EXPORT CSV
function exportData() {
    const data = "Name,Time\nAjay,09:15\nTejas,09:12";
    const blob = new Blob([data], { type: 'text/csv' });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "attendance.csv";
    a.click();
}
</script>

</body>
</html>
