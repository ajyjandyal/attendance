<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attend - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#003366',
                        secondary: '#bf0000',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-primary text-white flex flex-col shadow-xl transform -translate-x-full transition-transform duration-300 lg:translate-x-0 lg:static lg:inset-0">
            <div class="h-16 flex items-center px-6 bg-blue-900 border-b border-blue-800">
                <i class="fa-solid fa-expand text-xl mr-3 text-blue-300"></i>
                <span class="text-lg font-bold tracking-wider">SMART ATTEND</span>
            </div>
            
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="#" class="flex items-center px-4 py-3 bg-blue-800/50 text-white rounded-lg border-l-4 border-secondary">
                    <i class="fa-solid fa-chart-pie w-5 text-blue-300"></i>
                    <span class="ml-3 font-medium">Dashboard</span>
                </a>
                </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden relative">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="lg:hidden text-gray-600">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-bold text-gray-800">Overview</h1>
                </div>
                </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 mb-8">
                    </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                        <h2 class="text-lg font-bold text-gray-800 mb-4">Live Camera Feed</h2>
                        
                        <div class="w-full h-[300px] md:h-[400px] bg-gray-900 rounded-lg relative overflow-hidden flex flex-col items-center justify-center border-4 border-gray-800">
                            <video id="videoElement" class="w-full h-full object-cover hidden" autoplay playsinline muted></video>
                            
                            <div id="cameraPlaceholder" class="flex flex-col items-center">
                                <i class="fa-solid fa-video text-gray-600 text-5xl mb-4"></i>
                                <p class="text-gray-400 font-medium text-center px-4">Camera is currently offline</p>
                            </div>
                            
                            <div class="absolute top-8 left-8 w-8 h-8 border-t-4 border-l-4 border-green-500"></div>
                            <div class="absolute top-8 right-8 w-8 h-8 border-t-4 border-r-4 border-green-500"></div>
                            <div class="absolute bottom-8 left-8 w-8 h-8 border-b-4 border-l-4 border-green-500"></div>
                            <div class="absolute bottom-8 right-8 w-8 h-8 border-b-4 border-r-4 border-green-500"></div>
                        </div>
                        
                        <div class="mt-4 flex gap-4">
                            <button onclick="startCamera()" class="px-4 py-2 bg-primary text-white rounded-md font-medium text-sm hover:bg-blue-800 transition-colors">
                                <i class="fa-solid fa-play mr-2"></i> Start Scanner
                            </button>
                            <button onclick="stopCamera()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-md font-medium text-sm hover:bg-gray-50 transition-colors">
                                <i class="fa-solid fa-stop mr-2"></i> Stop
                            </button>
                        </div>
                    </div>
                    </div>
            </div>
        </main>
    </div>

<script>
// 1. CLOCK LOGIC
function updateTime() {
    const now = new Date();
    const timeSpan = document.getElementById('currentTime');
    if(timeSpan) timeSpan.innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}
setInterval(updateTime, 1000);
updateTime();

// 2. SIDEBAR TOGGLE (For Mobile Responsiveness)
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

// 3. CAMERA LOGIC
let videoStream = null;

async function startCamera() {
    const video = document.getElementById("videoElement");
    const placeholder = document.getElementById("cameraPlaceholder");

    try {
        videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" } // or "environment" for back camera
        });

        video.srcObject = videoStream;
        video.classList.remove("hidden");
        placeholder.classList.add("hidden");
    } catch (err) {
        alert("Error: Please grant camera permissions.");
        console.error("Camera Error:", err);
    }
}

function stopCamera() {
    const video = document.getElementById("videoElement");
    const placeholder = document.getElementById("cameraPlaceholder");

    if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
    }

    video.srcObject = null;
    video.classList.add("hidden");
    placeholder.classList.remove("hidden");
}
</script>

</body>
</html>
