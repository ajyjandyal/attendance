                        </div>

                    </div>

<script>
    function showView(viewName) {
    // 1. Toggle the Views
    document.getElementById('view-dashboard').classList.add('hidden');
    document.getElementById('view-database').classList.add('hidden');
    document.getElementById('view-' + viewName).classList.remove('hidden');

    // 2. Update Sidebar Active Styles
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        item.classList.remove('bg-blue-800/50', 'text-white', 'border-l-4', 'border-secondary');
        item.classList.add('text-gray-300');
    });

    const activeItem = document.getElementById('nav-' + viewName);
    activeItem.classList.add('bg-blue-800/50', 'text-white', 'border-l-4', 'border-secondary');
    activeItem.classList.remove('text-gray-300');

    // 3. Close sidebar on mobile after clicking
    if (window.innerWidth < 1024) {
        toggleSidebar();
    }
}
// 1. CLOCK LOGIC
function updateTime() {
    const now = new Date();
    const timeSpan = document.getElementById('currentTime');
    if(timeSpan) timeSpan.innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}
setInterval(updateTime, 1000);
updateTime();

// 2. SIDEBAR TOGGLE (For Mobile Responsiveness)
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('-translate-x-full');
    overlay.classList.toggle('hidden');
}

// 3. CAMERA LOGIC
let videoStream = null;

async function startCamera() {
    const video = document.getElementById("videoElement");
    const placeholder = document.getElementById("cameraPlaceholder");

    try {
        videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" } // or "environment" for back camera
        });

        video.srcObject = videoStream;
        video.classList.remove("hidden");
        placeholder.classList.add("hidden");
    } catch (err) {
        alert("Error: Please grant camera permissions.");
        console.error("Camera Error:", err);
    }
}

function stopCamera() {
    const video = document.getElementById("videoElement");
    const placeholder = document.getElementById("cameraPlaceholder");

    if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
    }

    video.srcObject = null;
    video.classList.add("hidden");
    placeholder.classList.remove("hidden");
}
</script>
